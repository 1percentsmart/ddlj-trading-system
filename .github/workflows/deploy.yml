name: Build & Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Type check
        run: npx tsc --noEmit
      
      - name: Lint
        run: npx next lint
      
      - name: Build
        run: npm run build
      
      - name: Build verification
        run: |
          echo "✅ Build successful!"
          echo "The app is ready for deployment."
          echo "Deploy to Vercel: https://vercel.com/new"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install Vercel CLI
        run: npm install -g vercel
      
      - name: Pull Vercel Environment Info
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        continue-on-error: true
      
      - name: Build with Vercel
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        continue-on-error: true
      
      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        continue-on-error: true
      
      - name: Deployment note
        run: |
          echo "If Vercel deployment failed, it means the VERCEL_TOKEN secret"
          echo "needs to be a proper Vercel Access Token (not an AI Gateway key)."
          echo ""
          echo "To fix: Go to https://vercel.com/account/tokens"
          echo "Create a new token with 'Full Account' scope"
          echo "Then update the VERCEL_TOKEN GitHub secret"
          echo ""
          echo "Or simply import the repo at: https://vercel.com/new"
